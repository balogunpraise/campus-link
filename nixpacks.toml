# Nixpacks build config for the CampusLink API (.NET 10).
#
# The file must be named nixpacks.toml — Nixpacks ignores any other name and
# silently falls back to auto-detection, which picks whatever .NET SDK its
# default nixpkgs archive happens to ship.

# dotnet-sdk_10 only exists in reasonably recent nixpkgs. If the build fails with
# "attribute 'dotnet-sdk_10' missing", pin a newer archive by uncommenting the
# line below and setting it to a nixpkgs commit that contains the package.
# nixpkgsArchive = "<nixpkgs-commit-sha>"

[phases.setup]
# Pins the toolchain explicitly rather than letting the provider guess. ICU is
# needed because the app does culture-aware work — slug generation normalizes
# accents, and RegionInfo validates ISO country codes — so a globalization-
# invariant runtime would throw at runtime, not at build time.
nixPkgs = ["dotnet-sdk_10", "icu"]

[phases.install]
cmds = ["dotnet restore CampusLink.sln"]

[phases.build]
# Publish only the API: it references Core and Infrastructure, so they come
# along, and nothing else in the solution is a deployable.
cmds = [
  "dotnet publish CampusLink.Api/CampusLink.Api.csproj -c Release -o /app/out --no-restore"
]

[start]
# ASPNETCORE_URLS binds to the port the platform assigns. Without it Kestrel
# listens on its default port, the health check never passes, and the deploy
# looks like a crash loop for no visible reason.
cmd = "ASPNETCORE_URLS=http://0.0.0.0:${PORT:-8080} dotnet /app/out/CampusLink.Api.dll"

[variables]
ASPNETCORE_ENVIRONMENT = "Production"

# Quieter startup logs and no diagnostic phone-home from the build.
DOTNET_NOLOGO = "true"
DOTNET_CLI_TELEMETRY_OPTOUT = "true"
DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "true"
